<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top-bar">
    <div class="product-title">AI Workspace</div>

    <nav class="tab-bar" role="tablist" aria-label="AI services">
      <span class="tab-glider" aria-hidden="true"></span>

      <button class="tab-btn active" type="button" role="tab" aria-selected="true" aria-controls="chatgpt" tabindex="0" data-tab="chatgpt" data-provider="gpt">
        <svg class="provider-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.25c1.82 0 3.17.88 3.93 2.17a4.6 4.6 0 0 1 4.49 5.7 4.63 4.63 0 0 1-1.88 7.22 4.58 4.58 0 0 1-6.54 2.3 4.58 4.58 0 0 1-6.54-2.3 4.63 4.63 0 0 1-1.88-7.22 4.6 4.6 0 0 1 4.49-5.7A4.45 4.45 0 0 1 12 3.25Zm0 2.05c-.9 0-1.67.44-2.12 1.14l3.18 1.84a1 1 0 0 1 .5.86v3.7l2.26-1.3V8.2A3.22 3.22 0 0 0 12 5.3Zm-4.92 2.2a2.55 2.55 0 0 0-2.03 3.96l3.18-1.84a1 1 0 0 1 .99 0l3.2 1.85V8.86L9.54 7.2a3.04 3.04 0 0 0-2.46.3Zm10.66.54v3.67a1 1 0 0 1-.5.86l-3.2 1.85 2.27 1.3 2.89-1.67a2.55 2.55 0 0 0-1.46-6.01ZM4.54 13.38a2.55 2.55 0 0 0 1.45 3.44l2.9-1.67a1 1 0 0 1 .99 0l3.2 1.85v-2.62l-2.26-1.3-3.19 1.83a1 1 0 0 1-1 0l-2.09-1.53Zm11.23 2.99-3.19 1.84a1 1 0 0 1-1 0l-3.19-1.84-2.26 1.3a2.55 2.55 0 0 0 4.12 1.72v-3.67l1.75 1.01 1.75-1.01v3.67a2.55 2.55 0 0 0 4.12-1.72l-2.1-1.3Z"/>
        </svg>
        <span class="tab-label">ChatGPT</span>
      </button>

      <button class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="claude" tabindex="-1" data-tab="claude" data-provider="claude">
        <svg class="provider-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.8 14.05 8l5.15-2.05-2.05 5.15L22.3 13.2l-5.15 2.05 2.05 5.15-5.15-2.05L12 23.2l-2.05-4.85L4.8 20.4l2.05-5.15L1.7 13.2l5.15-2.1L4.8 5.95 9.95 8 12 2.8Zm0 6.1-1.02 2.58-2.58-1.03 1.03 2.58-2.58 1.02 2.58 1.03-1.03 2.58 2.58-1.03L12 19.2l1.02-2.57 2.58 1.03-1.03-2.58 2.58-1.03-2.58-1.02 1.03-2.58-2.58 1.03L12 8.9Z"/>
        </svg>
        <span class="tab-label">Claude</span>
      </button>

      <button class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="gemini" tabindex="-1" data-tab="gemini" data-provider="gemini">
        <svg class="provider-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.5c1.08 4.67 3.86 7.45 8.5 8.5-4.64 1.05-7.42 3.83-8.5 8.5-1.08-4.67-3.86-7.45-8.5-8.5 4.64-1.05 7.42-3.83 8.5-8.5Zm0 5.55A8.3 8.3 0 0 1 9.05 11 8.3 8.3 0 0 1 12 13.95 8.3 8.3 0 0 1 14.95 11 8.3 8.3 0 0 1 12 8.05Z"/>
        </svg>
        <span class="tab-label">Gemini</span>
      </button>
    </nav>

    <div class="toolbar" aria-label="Browser controls">
      <button class="tool-btn" type="button" id="back-btn" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7 1.4-1.4-5.6-5.6 5.6-5.6L14.5 5Z"/></svg>
      </button>
      <button class="tool-btn" type="button" id="forward-btn" title="Forward" aria-label="Forward">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 19 7-7-7-7-1.4 1.4 5.6 5.6-5.6 5.6L9.5 19Z"/></svg>
      </button>
      <button class="tool-btn" type="button" id="reload-btn" title="Reload" aria-label="Reload">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h8V3l-3.3 3.3Z"/></svg>
      </button>
    </div>
  </header>

  <main class="content-area">
    <webview
      id="chatgpt"
      class="ai-view active"
      src="https://chatgpt.com"
      partition="persist:chatgpt"
      allowpopups>
    </webview>

    <webview
      id="claude"
      class="ai-view"
      src="https://claude.ai"
      partition="persist:claude"
      allowpopups>
    </webview>

    <webview
      id="gemini"
      class="ai-view"
      src="https://gemini.google.com"
      partition="persist:gemini"
      allowpopups>
    </webview>
  </main>

  <script>
    const providerAccents = {
      gpt: {
        accent: '#10a37f',
        glow: 'rgba(16, 163, 127, .35)',
        headerStart: '#000000',
        headerEnd: '#000000',
        headerGlow: 'rgba(0, 0, 0, 0)'
      },
      claude: {
        accent: '#d97757',
        glow: 'rgba(217, 119, 87, .35)',
        headerStart: '#1f1f1d',
        headerEnd: '#1f1f1d',
        headerGlow: 'rgba(31, 31, 29, 0)'
      },
      gemini: {
        accent: '#4d8bf0',
        glow: 'rgba(77, 139, 240, .35)',
        headerStart: '#101010',
        headerEnd: '#101010',
        headerGlow: 'rgba(16, 16, 16, 0)'
      }
    };

    const root = document.documentElement;
    const tabTrack = document.querySelector('.tab-bar');
    const tabGlider = document.querySelector('.tab-glider');
    const tabButtons = Array.from(document.querySelectorAll('.tab-btn'));
    const views = Array.from(document.querySelectorAll('.ai-view'));
    const backButton = document.getElementById('back-btn');
    const forwardButton = document.getElementById('forward-btn');
    const reloadButton = document.getElementById('reload-btn');

    function activeView() {
      return document.querySelector('.ai-view.active');
    }

    function updateNavigationState() {
      const view = activeView();
      if (!view || !view.canGoBack) {
        return;
      }

      backButton.disabled = !view.canGoBack();
      forwardButton.disabled = !view.canGoForward();
    }

    function updateGlider() {
      const activeTab = document.querySelector('.tab-btn.active');
      if (!activeTab || !tabGlider) {
        return;
      }

      const trackPadding = parseFloat(getComputedStyle(tabTrack).paddingLeft) || 0;
      tabGlider.style.width = `${activeTab.offsetWidth}px`;
      tabGlider.style.transform = `translateX(${activeTab.offsetLeft - trackPadding}px)`;
    }

    function applyProviderAccent(provider) {
      const providerTheme = providerAccents[provider] || providerAccents.gpt;
      root.style.setProperty('--accent', providerTheme.accent);
      root.style.setProperty('--glow', providerTheme.glow);
      root.style.setProperty('--header-start', providerTheme.headerStart);
      root.style.setProperty('--header-end', providerTheme.headerEnd);
      root.style.setProperty('--header-glow', providerTheme.headerGlow);
    }

    function switchTab(tabId) {
      const activeButton = tabButtons.find((button) => button.dataset.tab === tabId);

      tabButtons.forEach((button) => {
        const isActive = button === activeButton;
        button.classList.toggle('active', isActive);
        button.setAttribute('aria-selected', String(isActive));
        button.tabIndex = isActive ? 0 : -1;
      });

      views.forEach((view) => {
        view.classList.toggle('active', view.id === tabId);
      });

      if (activeButton) {
        applyProviderAccent(activeButton.dataset.provider);
      }

      updateGlider();
      updateNavigationState();
    }

    tabButtons.forEach((button) => {
      button.addEventListener('click', () => switchTab(button.dataset.tab));
      button.addEventListener('keydown', (event) => {
        const currentIndex = tabButtons.indexOf(event.currentTarget);
        let nextIndex = currentIndex;

        if (event.key === 'ArrowLeft') {
          nextIndex = (currentIndex - 1 + tabButtons.length) % tabButtons.length;
        } else if (event.key === 'ArrowRight') {
          nextIndex = (currentIndex + 1) % tabButtons.length;
        } else if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          switchTab(event.currentTarget.dataset.tab);
          return;
        } else {
          return;
        }

        event.preventDefault();
        tabButtons[nextIndex].focus();
      });
    });

    views.forEach((view) => {
      view.addEventListener('did-navigate', updateNavigationState);
      view.addEventListener('did-navigate-in-page', updateNavigationState);
      view.addEventListener('dom-ready', updateNavigationState);
    });

    backButton.addEventListener('click', () => {
      const view = activeView();
      if (view && view.canGoBack()) {
        view.goBack();
      }
    });

    forwardButton.addEventListener('click', () => {
      const view = activeView();
      if (view && view.canGoForward()) {
        view.goForward();
      }
    });

    reloadButton.addEventListener('click', () => {
      const view = activeView();
      if (view) {
        view.reload();
      }
    });

    window.addEventListener('load', updateGlider);
    window.addEventListener('resize', updateGlider);
    applyProviderAccent('gpt');
    updateGlider();
  </script>
</body>
</html>
